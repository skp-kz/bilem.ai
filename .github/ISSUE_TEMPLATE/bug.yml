name: Ошибка
description: Что-то работает не так, как описано
labels: ["bug"]
body:
  - type: dropdown
    id: part
    attributes:
      label: Где
      options: ["Bilem Agent (программа Windows)", "Установщик / обновление", "Кабинет app.bilem.ai", "Документация"]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Версия
      placeholder: "0.3.0-beta.1 («Сервис» → «Обновления»)"
    validations: { required: true }
  - type: input
    id: platform
    attributes:
      label: Платформа и конфигурация 1С
      placeholder: "8.3.25.1374, Бухгалтерия для Казахстана 3.0.52, файловая / сервер"
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      placeholder: "1. … 2. … 3. …"
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Что ожидали и что получили
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Журнал / ответ MCP
      description: Без паролей, токенов и данных клиентов. Подойдёт «Сервис» → «Собрать системную информацию»; токен MCP в адресе замените на ***.
      render: text
